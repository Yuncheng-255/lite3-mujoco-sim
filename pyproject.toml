[project]
name = "lite3-mujoco-sim"
version = "0.1.0"
description = "DeepRobotics Lite3 四足机器狗的 MuJoCo 仿真最小工程"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "Pillow>=10",
]

[project.optional-dependencies]
voice = [
    "sherpa-onnx>=1.12",
    # 镜像元数据缺失 sherpa-onnx 对 core（原生动态库）的依赖声明，需显式锁定
    "sherpa-onnx-core==1.13.8",
    "sounddevice>=0.5",
]
semantic = [
    "huggingface-hub>=0.24",
    "tokenizers>=0.19",
]
llm = [
    "openai>=1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lite3_sim = ["py.typed"]
