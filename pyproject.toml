[project]
name = "lite3-mujoco-sim"
version = "0.1.0"
description = "DeepRobotics Lite3 四足机器狗的 MuJoCo 仿真最小工程"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "opencc-python-reimplemented>=0.1",
    "Pillow>=10",
]

[project.optional-dependencies]
voice = [
    "av>=11,<14",
    "faster-whisper>=1",
    "huggingface-hub>=0.24",
    "sounddevice>=0.5",
    "tokenizers>=0.19",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lite3_sim = ["py.typed"]
